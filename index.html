<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TextForge</title>

    <link rel="stylesheet" href="assets/css/app.css">

    <script defer src="assets/js/app.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>    
</head>

<body>

    <section class="app" x-data="textFormatter">

        <header class="app-head">
            <h1>TextForge</h1>
            <ul class="stats" aria-label="Input statistics">
                <li><b x-text="stats.words"></b> words</li>
                <li><b x-text="stats.chars"></b> characters</li>
                <li><b x-text="stats.noSpaces"></b> without spaces</li>
                <li><b x-text="stats.lines"></b> lines</li>
                <li><b x-text="stats.sentences"></b> sentences</li>
                <li><b x-text="stats.reading"></b> reading time</li>
            </ul>
        </header>

        <!-- TOOLS (side) -->
        <aside class="sidebar" aria-label="Tools">
            <div class="tabs" role="tablist" aria-label="Tool categories">
                <template x-for="t in tabs" :key="t.id">
                    <button type="button" class="tab" role="tab" :id="'tab-' + t.id" :aria-selected="tab === t.id"
                        :aria-controls="'panel-' + t.id" @click="tab = t.id" x-text="t.label"></button>
                </template>
            </div>

            <!-- Format -->
            <div class="panel" role="tabpanel" id="panel-format" aria-labelledby="tab-format" x-show="tab === 'format'">
                <div class="row">
                    <label class="param">Line width
                        <input class="w-num" type="number" min="1" x-model.number="charLimit">
                    </label>
                    <button class="btn" type="button" @click="apply('wrap')"
                        title="Break lines so none is longer than the line width">Wrap text</button>
                </div>
                <div class="row">
                    <label class="param">Separator
                        <input class="w-sep" type="text" maxlength="1" x-model="separator">
                    </label>
                    <button class="btn" type="button" @click="apply('slugify')"
                        title="Hello World! → hello-world (one slug per line)">Slugify</button>
                    <button class="btn btn-alt" type="button" @click="apply('unslugify')"
                        title="hello-world → Hello World">Unslugify</button>
                </div>
                <div class="row">
                    <button class="btn" type="button" @click="apply('hashtags')"
                        title="Turns “Learn English, Idioms” into #LearnEnglish #Idioms, and back">Hashtags ⇄
                        List</button>
                </div>
            </div>

            <!-- Case -->
            <div class="panel" role="tabpanel" id="panel-case" aria-labelledby="tab-case" x-show="tab === 'case'"
                x-cloak>
                <div class="row cols2">
                    <template x-for="c in cases" :key="c.id">
                        <button class="btn" type="button" @click="apply('convertCase', c.id)" :title="c.hint"
                            x-text="c.label"></button>
                    </template>
                </div>
            </div>

            <!-- Lists -->
            <div class="panel" role="tabpanel" id="panel-lists" aria-labelledby="tab-lists" x-show="tab === 'lists'"
                x-cloak>
                <template x-for="g in listGroups" :key="g.label">
                    <div class="row">
                        <span class="row-label" x-text="g.label"></span>
                        <template x-for="i in g.items" :key="i.arg">
                            <button class="btn" type="button" @click="apply('listOp', i.arg)" :title="i.hint"
                                x-text="i.label"></button>
                        </template>
                    </div>
                </template>
            </div>
        </aside>

        <!-- INPUT -->
        <div class="pane pane-in">
            <div class="pane-head">
                <label for="input">Input</label>
                <span class="spacer"></span>
                <button class="link-btn" type="button" @click="clearAll()" x-show="userInput || formattedOutput"
                    x-cloak>Clear all</button>
            </div>
            <textarea id="input" class="textarea-in" x-ref="input" x-model="userInput"
                placeholder="Paste or type your text here. For lists, put one item per line."></textarea>
        </div>

        <!-- OUTPUT -->
        <div class="pane pane-out">
            <div class="pane-head">
                <h2>Formatted text</h2>
                <button class="btn-copy" type="button" :class="{ done: copied }" @click="copyToClipboard()"
                    x-text="copied ? 'Copied ✓' : 'Copy'"></button>
                <button class="btn-ghost" type="button" @click="useAsInput()" x-show="formattedOutput" x-cloak
                    title="Move the result into the input so you can chain another tool">Use as input</button>
                <span class="spacer"></span>
                <span class="chip" x-show="formattedOutput" x-cloak><b x-text="[...formattedOutput].length"></b>
                    characters</span>
            </div>
            <textarea class="textarea-out" :class="{ flash: pulse }" x-ref="resultRef" x-model="formattedOutput"
                readonly aria-label="Formatted text" placeholder="Your result will appear here."></textarea>
        </div>

        <div class="toast" role="status" aria-live="polite" :class="{ show: toastVisible }" x-text="toastMsg"></div>
    </section>    
</body>

</html>
